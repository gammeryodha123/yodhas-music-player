name: Build YODHAS Music Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo add-apt-repository universe -y
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev ffmpeg
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer kivy yt-dlp

    - name: Set up Buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform/build-*
        buildozer android debug --help || true

    - name: Build APK with Buildozer
      run: |
        cd /home/runner/work/yodhas-music-player/yodhas-music-player
        buildozer android clean
        buildozer android debug

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yodhas-music-apk
        path: bin/*.apk
        retention-days: 30
